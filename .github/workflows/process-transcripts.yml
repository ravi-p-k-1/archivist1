name: Process transcripts

on:
  pull_request:
    types: [opened, reopened]
    paths: ["transcripts/**/transcript.json"]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to reprocess"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "archivist-${{ github.event.pull_request.number || inputs.pr }}"
  cancel-in-progress: false

jobs:
  process:
    name: Process the pending transcript
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'cloudflare/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve PR number and head ref
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NUMBER="${{ inputs.pr }}"
            HEAD_REF=$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
          else
            NUMBER="${{ github.event.pull_request.number }}"
            HEAD_REF="${{ github.head_ref }}"
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Check out the PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Prepare the transcript
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          python -m archivist prepare
          { echo "prompt<<ARCHIVIST_EOF"; cat .archivist/prompt.txt; echo "ARCHIVIST_EOF"; } >> "$GITHUB_OUTPUT"
          { echo "schema<<ARCHIVIST_EOF"; cat .archivist/schema.json; echo "ARCHIVIST_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Run Claude (attempt 1)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: >-
            --model ${{ vars.ARCHIVIST_MODEL || 'sonnet' }}
            --json-schema '${{ steps.prep.outputs.schema }}'
            --allowedTools "Read,Bash(python -m archivist check-evidence:*)"
            --disallowedTools "Edit,Write,MultiEdit,WebFetch,WebSearch"

      - name: Verify (attempt 1)
        id: verify
        continue-on-error: true
        shell: bash
        env:
          REPORT: ${{ steps.claude.outputs.structured_output }}
        run: python -m archivist verify

      - name: Build retry prompt
        if: steps.verify.outcome == 'failure'
        id: retry_prep
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .archivist/prompt.txt
            echo
            echo "Your previous submission was rejected:"
            cat .archivist/verify-error.txt
            echo
            echo "Fix the problem above and submit again."
          } > .archivist/retry-prompt.txt
          { echo "prompt<<ARCHIVIST_EOF"; cat .archivist/retry-prompt.txt; echo "ARCHIVIST_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Run Claude (attempt 2)
        if: steps.verify.outcome == 'failure'
        id: claude_retry
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.retry_prep.outputs.prompt }}
          claude_args: >-
            --model ${{ vars.ARCHIVIST_MODEL || 'sonnet' }}
            --json-schema '${{ steps.prep.outputs.schema }}'
            --allowedTools "Read,Bash(python -m archivist check-evidence:*)"
            --disallowedTools "Edit,Write,MultiEdit,WebFetch,WebSearch"

      - name: Verify (attempt 2)
        if: steps.verify.outcome == 'failure'
        id: verify_retry
        shell: bash
        env:
          REPORT: ${{ steps.claude_retry.outputs.structured_output }}
        run: python -m archivist verify

      - name: Finalize
        shell: bash
        env:
          ARCHIVIST_MODEL: ${{ vars.ARCHIVIST_MODEL || 'sonnet' }}
        run: python -m archivist finalize --model "$ARCHIVIST_MODEL"

      - name: Commit results
        shell: bash
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- transcripts archived output
          git commit -m "chore: process transcript"
          git push origin "HEAD:$HEAD_REF"

      - name: Comment on the PR
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr comment "$PR_NUMBER" --body-file .archivist/summary.md
